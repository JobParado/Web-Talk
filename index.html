<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Account Page</title>

    <link rel="manifest" href="/site.webmanifest">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {

                navigator.serviceWorker.register('/sw.js')
                    // .then(reg => console.log('PWA Active'))
                    .catch(err => console.log('PWA Error', err));
            });
        }
    </script>

    <link rel="icon" type="image/x-icon" href="./images/favicon_io/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/LoginCreate.css">
    <script type="module" src="./src/account/loginEmail.js"></script>
    <script type="module" src="./src/account/loginGoogle.js"></script>

    <style>
        #btn-login-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #1f1f1f;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
            letter-spacing: 0.25px;
            padding: 0 12px;
            height: 40px;
            border: 1px solid #747775;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.218s, border-color 0.218s, box-shadow 0.218s;
            box-sizing: border-box;
            width: 100%;
            margin-bottom: 20px;
        }

        #btn-login-google .google-icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        #btn-login-google:active {
            background-color: #ebf1fa;
        }

        #btn-login-google:focus-visible {
            outline: none;
            border-color: #0b57d0;
            background-color: #f8fafd;
        }
    </style>
</head>

<body>
    <header>
        <h2>WebTalk</h2>
        <p>Connect and chat with friends</p>
    </header>
    
    <div class="parent">
        <div class="content">
            
            <h2>Sign In</h2>
            <p>Welcome back — Enter your credentials</p>


            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="email" class="form-control input-field" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control input-field" id="password" required>
            </div>
            <div style="display: flex; gap: 10px; justify-content: start; margin-bottom: 20px; margin-top: 20px;">
                <input type="checkbox" class="checkbox" onclick="togglePassword()">
                <label for="showPassword">Show Password</label>
            </div>
            <button type="submit" class="btn btn-primary btn-submit" id="btn-login-email">Sign in</button>

            <div class="separator">
                <span>or</span>
            </div>

            <button type="button" id="btn-login-google">
                <div class="google-icon-wrapper">
                    <svg width="100%" height="100%" viewBox="0 0 24 24" xmlns="http://w3.org">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                </div>
                <span>Sign in with Google</span>
            </button>

            <p>Dont Have An Account? <a href="/create.html" class="anchor-link">Sign Up</a></p>

        </div>
    </div>

    <script>
        function togglePassword() {
            var str = document.getElementById("password");
            if (str.type === "password") {
                str.type = "text";
            } else {
                str.type = "password";
            }
        }
    </script>

</body>

</html>
