
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account Page</title>

    <link rel="manifest" href="/site.webmanifest">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {

            navigator.serviceWorker.register('/sw.js')
                // .then(reg => console.log('PWA Active'))
                .catch(err => console.log('PWA Error', err));
            });
        }
    </script>

    <link rel="icon" type="image/x-icon" href="./images/favicon_io/favicon.ico">
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="./css/LoginCreate.css">
    <script type="module" src="./src/account/registerEmail.js"></script>
    <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body>
    <header>
        <h2>
            <span>WebTalk</span>
            <i class="bi bi-chat-dots-fill"></i>
        </h2>
        <p>Create your account to get started</p>
    </header>

    <div class="parent">
        <div class="content">
            <h2>
                <i class="bi bi-person-circle"></i>
                <span>Create Account</span>
            </h2>
            <p>Sign up with your email and password</p>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control input-field" id="email" required name="email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control input-field" id="password" required name="password">
            </div>
            
            <div id="toggle-password-signup">
                <input type="checkbox" class="checkbox" id="showPassword" onclick="togglePass(this)">
                <label for="showPassword">Show Password</label>
            </div>

            <button class="btn btn-primary btn-submit" id="btn-register">Create account</button>

            <p class="anchor-p">Already have an account? <a href="/index.html" class="anchor-link">Sign in</a></p>

        </div>
    </div>

    <script>
        function togglePass(checkbox) {
            let x = document.getElementById("password");
            x.type = checkbox.checked ? "text" : "password";
        }
    </script>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.js"></script>
</body>

</html>
