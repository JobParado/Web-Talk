
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account Page</title>

    <link rel="manifest" href="/site.webmanifest">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {

            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('PWA Active'))
                .catch(err => console.log('PWA Error', err));
            });
        }
    </script>

    <link rel="icon" type="image/x-icon" href="./images/favicon_io/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/LoginCreate.css">
    <script type="module" src="./src/account/registerEmail.js"></script>
</head>

<body>
    <header>
        <h2>Welcome to WebTalk!</h2>
    </header>

    <div class="parent">
        <div class="content">
            <h2 style="text-align: center;">Create Your Account 📧</h2>



            <!-- <form id="registerForm" class="registerForm" action="create.php" method="post"> -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required name="email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required name="password">
            </div>
            <div style="display: flex; gap: 10px; justify-content: start; margin-bottom: 10px;">
                <input type="checkbox" class="checkbox" id="showPassword" onclick="togglePass(this)">
                <label for="showPassword">Show Password</label>
            </div>
            <p id="status" style="display:none"></p>
            <button class="btn btn-primary btn-submit" id="btn-register">Create my account</button>

            <p class="anchor-p">Already Have An Account? <a href="/index.html" class="anchor-link">Sign In</a></p>
            <!-- </form> -->

        </div>
    </div>

    <script>
        function togglePass(checkbox) {
            let x = document.getElementById("password");
            x.type = checkbox.checked ? "text" : "password";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
