    <script>
        function demo() {
            let div1 = document.getElementsByClassName("content-1");
            div1.style.display = "none";

            let div2 = document.getElementsByClassName("content-1");
            div1.style.display = "none";
        }



        const tabLinks = document.querySelectorAll(".tab-link");
        const tabContents = document.querySelectorAll(".tab-content");

        function showTab(tabName) {

            tabLinks.forEach((link) => {
                const isCurrent = link.dataset.tab === tabName;
                link.classList.toggle("is-active", isCurrent);
            });


            tabContents.forEach((contentBlock) => {
                const shouldShow = contentBlock.dataset.tabContent === tabName;
                contentBlock.classList.toggle("is-visible", shouldShow);
            });
        }


        tabLinks.forEach((link) => {
            link.addEventListener("click", (event) => {

                event.preventDefault();


                const tabName = link.dataset.tab;

                showTab(tabName);
            });
        });


        if (tabLinks.length > 0) {
            showTab(tabLinks[0].dataset.tab);
        }
    </script>
